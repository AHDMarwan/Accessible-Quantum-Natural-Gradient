name: Test AQNG v2

on:
  pull_request:
  push:
    branches:
      - aqng-v2-orientation-controls

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package, tests, and experiment extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,experiments]"
      - name: Run unit tests
        run: pytest -q
      - name: Run AQNG v2 smoke gate
        run: python experiments/smoke_aqng_v2.py
