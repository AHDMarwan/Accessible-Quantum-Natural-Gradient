name: One-shot paper benchmark smoke test

on:
  push:
    paths:
      - '.github/workflows/smoke-once.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/requirements-paper.txt
      - name: Install pinned dependencies
        run: python -m pip install -r experiments/requirements-paper.txt
      - name: Run smoke test and capture log
        id: smoke
        shell: bash
        run: |
          set +e
          python experiments/smoke_paper_classification.py > smoke.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "exit_code=$status" > smoke_status.txt
          cat smoke.log
          exit 0
      - name: Commit smoke log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/smoke
          {
            echo "github_sha=${GITHUB_SHA}"
            echo "github_run_id=${GITHUB_RUN_ID}"
            cat smoke_status.txt
            echo
            cat smoke.log
          } > results/smoke/latest.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/smoke/latest.log
          git commit -m 'Record paper benchmark smoke test' || true
          git push origin HEAD:main
      - name: Fail workflow if smoke failed
        if: steps.smoke.outputs.status != '0'
        run: exit 1
