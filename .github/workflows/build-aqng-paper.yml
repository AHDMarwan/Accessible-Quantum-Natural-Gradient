name: Build AQNG paper PDF

on:
  push:
    paths:
      - 'paper/aqng/**/*.tex'
      - 'paper/aqng/*.bib'
      - 'paper/aqng/BUILD_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile REVTeX paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper/aqng
      - name: Store compiled PDF in repository
        run: |
          cp paper/aqng/main.pdf paper/aqng/AQNG_paper.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/aqng/AQNG_paper.pdf
          git diff --cached --quiet || git commit -m "Build AQNG paper PDF"
          git push
