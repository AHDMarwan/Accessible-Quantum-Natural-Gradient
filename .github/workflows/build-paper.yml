name: Build AQNG manuscript

on:
  pull_request:
    paths:
      - 'paper/manuscript/**'
      - '.github/workflows/build-paper.yml'
  push:
    branches: [main]
    paths:
      - 'paper/manuscript/**'
      - '.github/workflows/build-paper.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aqng-paper-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile REVTeX manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper/manuscript

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: aqng-manuscript-pdf
          path: paper/manuscript/main.pdf

      - name: Store canonical PDF on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp paper/manuscript/main.pdf /tmp/AQNG_paper.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/AQNG_paper.pdf paper/manuscript/AQNG_paper.pdf
          git add paper/manuscript/AQNG_paper.pdf
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build AQNG manuscript PDF"
          git push origin HEAD:main
