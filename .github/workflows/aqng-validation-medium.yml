name: AQNG medium validation gate

on:
  pull_request:
    paths:
      - 'aqng_validation.py'
      - 'experiments/aqng_validation_gate.py'
      - 'experiments/evaluate_validation_gate.py'
      - 'experiments/frozen_validation_hparams.json'
      - '.github/workflows/aqng-validation-medium.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  medium:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          # Analytic: 5 paired seeds per family, 20 steps.
          - {tag: analytic-haar-s0, family: su2_haar, seed: 0, shot_args: ''}
          - {tag: analytic-haar-s1, family: su2_haar, seed: 1, shot_args: ''}
          - {tag: analytic-haar-s2, family: su2_haar, seed: 2, shot_args: ''}
          - {tag: analytic-haar-s3, family: su2_haar, seed: 3, shot_args: ''}
          - {tag: analytic-haar-s4, family: su2_haar, seed: 4, shot_args: ''}
          - {tag: analytic-u1-s0, family: u1_rzxy, seed: 0, shot_args: ''}
          - {tag: analytic-u1-s1, family: u1_rzxy, seed: 1, shot_args: ''}
          - {tag: analytic-u1-s2, family: u1_rzxy, seed: 2, shot_args: ''}
          - {tag: analytic-u1-s3, family: u1_rzxy, seed: 3, shot_args: ''}
          - {tag: analytic-u1-s4, family: u1_rzxy, seed: 4, shot_args: ''}
          # Finite-shot: 3 paired seeds at 1k and 10k, including calibration.
          - {tag: shots1k-haar-s0, family: su2_haar, seed: 0, shot_args: '--shots 1000 --finite-shot-calibration --paired-shot-streams --support-pseudocount 0.5 --cov-lam 1e-3'}
          - {tag: shots1k-haar-s1, family: su2_haar, seed: 1, shot_args: '--shots 1000 --finite-shot-calibration --paired-shot-streams --support-pseudocount 0.5 --cov-lam 1e-3'}
          - {tag: shots1k-haar-s2, family: su2_haar, seed: 2, shot_args: '--shots 1000 --finite-shot-calibration --paired-shot-streams --support-pseudocount 0.5 --cov-lam 1e-3'}
          - {tag: shots10k-haar-s0, family: su2_haar, seed: 0, shot_args: '--shots 10000 --finite-shot-calibration --paired-shot-streams --support-pseudocount 0.5 --cov-lam 1e-3'}
          - {tag: shots10k-haar-s1, family: su2_haar, seed: 1, shot_args: '--shots 10000 --finite-shot-calibration --paired-shot-streams --support-pseudocount 0.5 --cov-lam 1e-3'}
          - {tag: shots10k-haar-s2, family: su2_haar, seed: 2, shot_args: '--shots 10000 --finite-shot-calibration --paired-shot-streams --support-pseudocount 0.5 --cov-lam 1e-3'}
          - {tag: shots1k-u1-s0, family: u1_rzxy, seed: 0, shot_args: '--shots 1000 --finite-shot-calibration --paired-shot-streams --support-pseudocount 0.5 --cov-lam 1e-3'}
          - {tag: shots1k-u1-s1, family: u1_rzxy, seed: 1, shot_args: '--shots 1000 --finite-shot-calibration --paired-shot-streams --support-pseudocount 0.5 --cov-lam 1e-3'}
          - {tag: shots1k-u1-s2, family: u1_rzxy, seed: 2, shot_args: '--shots 1000 --finite-shot-calibration --paired-shot-streams --support-pseudocount 0.5 --cov-lam 1e-3'}
          - {tag: shots10k-u1-s0, family: u1_rzxy, seed: 0, shot_args: '--shots 10000 --finite-shot-calibration --paired-shot-streams --support-pseudocount 0.5 --cov-lam 1e-3'}
          - {tag: shots10k-u1-s1, family: u1_rzxy, seed: 1, shot_args: '--shots 10000 --finite-shot-calibration --paired-shot-streams --support-pseudocount 0.5 --cov-lam 1e-3'}
          - {tag: shots10k-u1-s2, family: u1_rzxy, seed: 2, shot_args: '--shots 10000 --finite-shot-calibration --paired-shot-streams --support-pseudocount 0.5 --cov-lam 1e-3'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install experiment stack
        run: pip install -e '.[experiments]'
      - name: Run frozen validation cell
        shell: bash
        run: |
          python experiments/aqng_validation_gate.py \
            --family '${{ matrix.family }}' \
            --dataset iris01 \
            --seed '${{ matrix.seed }}' \
            --n-qubits 6 \
            --n-layers 3 \
            --n-samples 60 \
            --steps 20 \
            --loss-batch 4 \
            --metric-batch 2 \
            --metric-every 2 \
            --readout-order 1 \
            --alignment-batch 4 \
            --alignment-tangents 64 \
            --alignment-eval-tangents 64 \
            --lr 0.06 \
            --lam 0.003 \
            --metric-normalization trace \
            --damping-mode absolute \
            --max-direction-norm 8 \
            --max-metric-step 0.25 \
            ${{ matrix.shot_args }} \
            --output-dir 'validation_outputs/${{ matrix.tag }}'
      - uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.tag }}
          path: validation_outputs/${{ matrix.tag }}
          retention-days: 14

  summarize:
    runs-on: ubuntu-latest
    needs: medium
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gate-*
          path: downloaded
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - name: Aggregate outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, json
          root=Path('downloaded'); out=Path('validation_summary'); out.mkdir(exist_ok=True)
          specs={
            'results_all.csv':'results_*.csv',
            'calibration_all.csv':'calibration_diags_*.csv',
            'orientation_all.csv':'orientation_diags_*.csv',
            'curves_all.csv':'curves_*.csv',
            'metric_diags_all.csv':'metric_diags_*.csv',
          }
          def read_csv(p):
              with p.open(newline='',encoding='utf-8') as f: return list(csv.DictReader(f))
          counts={}
          for outname, pattern in specs.items():
              rows=[]
              for p in root.rglob(pattern):
                  tag=next((q.name.removeprefix('gate-') for q in p.parents if q.name.startswith('gate-')), p.parent.name)
                  for row in read_csv(p): row['validation_tag']=tag; rows.append(row)
              counts[outname]=len(rows)
              path=out/outname
              if not rows: path.write_text('',encoding='utf-8'); continue
              keys=[]; seen=set()
              for row in rows:
                  for k in row:
                      if k not in seen: seen.add(k); keys.append(k)
              with path.open('w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=keys); w.writeheader(); w.writerows(rows)
          (out/'manifest.json').write_text(json.dumps(counts,indent=2),encoding='utf-8')
          print(json.dumps(counts,indent=2))
          PY
      - name: Evaluate go/no-go gate
        run: |
          python experiments/evaluate_validation_gate.py \
            --results validation_summary/results_all.csv \
            --calibration validation_summary/calibration_all.csv \
            --output validation_summary/gate_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: aqng-medium-validation-summary
          path: validation_summary
          retention-days: 14
