name: Paper Classification Benchmark

on:
  workflow_dispatch:
    inputs:
      result_tag:
        description: "Immutable result folder name"
        required: true
        default: "paper_main_v1"
        type: string
      seed_count:
        description: "Paired seeds per dataset (paper main: 20)"
        required: true
        default: "20"
        type: string
      steps:
        description: "Training steps"
        required: true
        default: "20"
        type: string
      learning_rate:
        description: "Common fixed learning rate"
        required: true
        default: "0.03"
        type: string
      n_samples:
        description: "Samples per dataset before 75/25 split"
        required: true
        default: "80"
        type: string
      n_qubits:
        description: "Qubits (paper-linked default: 6; must be even)"
        required: true
        default: "6"
        type: string
      n_layers:
        description: "Classification-depth ansatz layers"
        required: true
        default: "3"
        type: string
      loss_batch:
        description: "Loss minibatch size"
        required: true
        default: "8"
        type: string
      metric_batch:
        description: "Metric minibatch size"
        required: true
        default: "4"
        type: string
      metric_every:
        description: "Refresh metric every N optimizer steps"
        required: true
        default: "2"
        type: string
      damping:
        description: "Metric damping lambda"
        required: true
        default: "0.001"
        type: string

permissions:
  contents: write

concurrency:
  group: paper-classification-results
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Validate inputs and build job matrix
        id: matrix
        env:
          SEED_COUNT: ${{ inputs.seed_count }}
          RESULT_TAG: ${{ inputs.result_tag }}
          N_QUBITS: ${{ inputs.n_qubits }}
        run: |
          python - <<'PY'
          import json, os, re
          seeds = int(os.environ["SEED_COUNT"])
          nq = int(os.environ["N_QUBITS"])
          tag = os.environ["RESULT_TAG"]
          if seeds < 1 or seeds > 100:
              raise SystemExit("seed_count must be in [1, 100]")
          if nq < 2 or nq % 2:
              raise SystemExit("n_qubits must be even and >= 2")
          if not re.fullmatch(r"[A-Za-z0-9._-]+", tag):
              raise SystemExit("result_tag may contain only letters, digits, '.', '_' and '-'")
          datasets = ["iris01", "breast_cancer", "wine01", "digits01"]
          include = [{"dataset": d, "seed": s} for d in datasets for s in range(seeds)]
          matrix = json.dumps({"include": include}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix}\n")
          print(f"Prepared {len(include)} dataset/seed jobs")
          PY

  validate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/requirements-paper.txt
      - name: Install pinned benchmark dependencies
        run: python -m pip install -r experiments/requirements-paper.txt
      - name: Mathematical and vectorization smoke test
        working-directory: experiments
        run: python smoke_paper_classification.py

  run:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/requirements-paper.txt
      - name: Install pinned benchmark dependencies
        run: python -m pip install -r experiments/requirements-paper.txt
      - name: Run paired paper benchmark cell
        run: |
          mkdir -p artifact
          python experiments/paper_classification.py \
            --dataset "${{ matrix.dataset }}" \
            --seed "${{ matrix.seed }}" \
            --n-qubits "${{ inputs.n_qubits }}" \
            --n-layers "${{ inputs.n_layers }}" \
            --n-samples "${{ inputs.n_samples }}" \
            --steps "${{ inputs.steps }}" \
            --lr "${{ inputs.learning_rate }}" \
            --lam "${{ inputs.damping }}" \
            --loss-batch "${{ inputs.loss_batch }}" \
            --metric-batch "${{ inputs.metric_batch }}" \
            --metric-every "${{ inputs.metric_every }}" \
            --output-dir artifact
      - name: Upload per-job result artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-${{ matrix.dataset }}-seed-${{ matrix.seed }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: [prepare, run]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/requirements-paper.txt
      - name: Install aggregation dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3" "scipy>=1.13,<2"
      - name: Download all successful job artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: paper-*
          path: collected
          merge-multiple: true
      - name: Validate completeness and compute paired statistics
        env:
          WORKFLOW_INPUTS_JSON: >-
            {"seed_count":"${{ inputs.seed_count }}","steps":"${{ inputs.steps }}","learning_rate":"${{ inputs.learning_rate }}","n_samples":"${{ inputs.n_samples }}","n_qubits":"${{ inputs.n_qubits }}","n_layers":"${{ inputs.n_layers }}","loss_batch":"${{ inputs.loss_batch }}","metric_batch":"${{ inputs.metric_batch }}","metric_every":"${{ inputs.metric_every }}","damping":"${{ inputs.damping }}"}
        run: |
          mkdir -p aggregated
          python experiments/aggregate_paper_classification.py \
            --input-dir collected \
            --output-dir aggregated \
            --seed-count "${{ inputs.seed_count }}" \
            --result-tag "${{ inputs.result_tag }}" \
            --workflow-inputs-json "$WORKFLOW_INPUTS_JSON"
      - name: Upload combined paper artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.result_tag }}-combined
          path: aggregated/*
          if-no-files-found: error
          retention-days: 90
      - name: Commit immutable result bundle to repository
        env:
          RESULT_TAG: ${{ inputs.result_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          DEST="results/paper/${RESULT_TAG}"
          if [ -e "$DEST" ]; then
            echo "Refusing to overwrite existing confirmatory result bundle: $DEST"
            exit 1
          fi
          mkdir -p "$DEST"
          cp aggregated/* "$DEST"/
          git add "$DEST"
          git commit -m "Add paper classification results: ${RESULT_TAG}"
          git push origin main
