[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aqng-pennylane"
version = "0.6.0"
description = "Accessible Quantum Natural Gradient optimizer with physical, random, and aligned measurement-aware readouts for PennyLane"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Marwan Ait Haddou", email = "aithaddou.marwan@edu.uca.ac.ma"},
]
dependencies = [
  "numpy>=1.24",
  "pennylane>=0.45,<0.46",
]

[project.optional-dependencies]
experiments = [
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
  "pennylane-lightning>=0.45,<0.46",
]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/AHDMarwan/Accessible-Quantum-Natural-Gradient"
ORCID = "https://orcid.org/0009-0008-1734-1721"
SpectralGeometrySource = "https://github.com/AHDMarwan/Spectral-Geometry-of-Accessible-Quantum-Tangents-Beyond-Isotropic-Readout-Rank-Laws"

[tool.setuptools]
packages = ["aqng"]
py-modules = ["aqng_pennylane", "aqng_efficient", "aqng_readouts", "aqng_validation"]
